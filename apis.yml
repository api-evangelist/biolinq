aid: biolinq
name: Biolinq
description: 'Biolinq Incorporated is a San Diego, California medical device and digital
  health company founded in 2012 that develops intradermal biowearable sensors. Its
  lead product, Biolinq Shine, is an autonomous needle-free continuous glucose sensor
  built on an array of electrochemical microsensors that sit just below the surface
  of the skin, combined with an accelerometer and an ambient light sensor so a single
  wearable measures glucose alongside activity and sleep. The sensor carries an on-body
  LED color indicator for time-in-range and pairs with a companion mobile application
  for trends and insights. The FDA granted Biolinq Shine De Novo classification for
  adults with type 2 diabetes not on insulin therapy, with a planned US market launch.
  Biolinq publishes no public developer program, API documentation, or machine-readable
  API contract; its public web presence is a corporate marketing site.'
